name: windows learner path

# What a Windows learner can actually do with the archives this site links.
#
# The site's rule is that a page may not claim a version of wolf that does
# not exist; this job extends the rule to the platform. Every sentence the
# Windows section writes about a command is a line this job PROVED against
# the LIVE published archive — fetched by the same URL the page prints,
# unpacked with the same `tar` the page tells a learner to type. It runs on
# every push (so a prose change cannot outrun the measurement) and weekly
# (so a withdrawn or broken archive is loud even when nobody is editing).
#
# At v0.2.2 the table this job holds FLIPPED. `wolf build` and `wolf run`
# were exit-2 refusals through v0.2.1; the s60a bring-up makes them produce
# and execute a real `hello.exe`, on one condition — the import libraries
# that come with Visual Studio Build Tools. The runner has them, so the job
# measures both branches: the toolchain present (build and run succeed), and
# the toolchain absent (the named refusal, quoted on the page verbatim). The
# second branch is reached honestly, by taking the Windows SDK's registry
# root out from under the compiler's MSVC discovery for the length of one
# command and putting it back.
#
# At v0.2.3 it flipped a second time, and this one retires a paragraph. The
# s60b task layer serves `spawn`/scopes, channels and `os.signal` on this
# host, so the twenty-one corpus rows that refused by construct name at
# v0.2.2 are gone, and the three parity probes ww11 recorded weekly are
# ASSERTED here rather than tabulated. What is left of the refusal story is
# named rows, and the job holds every one: `wolf build --release` (the LLVM
# tier, s60c) refuses by name, external `reload`/`upgrade` delivery has no
# Windows analog — the self-raise the corpus witness uses works, and the
# signal probe below is what proves it — the unix-domain family answers the
# `unsupported` row (ww13), and at v0.2.5 two more join them: `reuse_port`
# and a non-empty inherit set, both s137's, both measured below against
# their own corpus witnesses. Five is what /install/ counts, so five is what
# this job proves. The same step measures what s137 DOES serve here, because
# a page that only listed the refusals would be describing a worse host than
# the one a learner has.
on:
  push:
  schedule:
    - cron: '23 7 * * 1'   # Mondays, 07:23 UTC
  workflow_dispatch:

concurrency:
  group: windows-learner-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learner-path:
    name: the archive, on a real windows box
    runs-on: windows-latest
    defaults:
      run: {shell: pwsh}
    steps:
      # The pinned checkouts are where the advertised versions come from —
      # the same reading build.sh uses to stamp the pages. The job therefore
      # tests the archives the site advertises, not whatever is newest.
      - uses: actions/checkout@v5
        with: {submodules: recursive}

      - name: the versions the site advertises
        run: |
          $line = Select-String -Path upstream/wolf-lang/CHANGELOG.md -Pattern '^## (\d[\d.]*) ' | Select-Object -First 1
          if (-not $line) { Write-Output "::error::no release heading in the pinned wolf-lang CHANGELOG.md"; exit 1 }
          $ver = $line.Matches[0].Groups[1].Value
          "WOLF_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $lup = (Select-String -Path upstream/wolf-interp/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $lup) { Write-Output "::error::no version in the pinned wolf-interp Cargo.toml"; exit 1 }
          "LUPIN_VER=$lup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "the pins say wolf $ver, lupin $lup"

      # THE PIN LAG. The two implementations are compared against one
      # specification, but they do not tag together, and the site has to say
      # which one is behind. /install/ and /play/ both write that sentence in
      # prose, so it is held here rather than trusted — both facts come out of
      # the two pinned CHANGELOGs, no tag objects needed.
      #
      # Through ww13 this step accepted exactly ONE release of lag, because
      # that is what the pages said. lupin 0.1.25 caught up — it was released
      # against pin `982f857`, wolf v0.2.4, the tag this site advertises — and
      # the step went red the way it was built to, which is how the sentence
      # got rewritten instead of quietly becoming false. ww14 widened it to
      # ZERO OR ONE and had it decide which.
      #
      # ww17 retired the ceiling, because at wolf v0.2.7 the ceiling was
      # wrong rather than the world. That release is a pairing re-stamp and a
      # CI job; it moved no language surface, and the interpreter had no
      # reason to tag against it. So the compiler tagged twice (v0.2.6,
      # v0.2.7) while lupin held at 0.1.27, the gap became two, and the old
      # step would have called that "a lupin release was skipped or a pin was
      # never bumped" — a diagnosis that was never true. The gap is now
      # COUNTED, as the distance from the advertised release back to the one
      # lupin names, over the pinned CHANGELOG's own ordering.
      #
      # And the number is held against the PROSE, which is the half a version
      # literal cannot cover. The lag is stated in three places across two
      # pages, and one of them ("one release behind the compiler's at these
      # pins") carries no version literal and no placeholder at all, so both
      # site audits are blind to it and it sat stale through a bump. This step
      # requires the phrase for the counted gap to appear on BOTH pages and
      # the phrases for the other gaps to appear on NEITHER, so a paragraph
      # that was not rewritten reds by name.
      - name: the specification pin lag the site records
        run: |
          $rel = Select-String -Path upstream/wolf-lang/CHANGELOG.md -Pattern '^## (\d[\d.]*) ' |
                   ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($rel.Count -lt 2) { Write-Output "::error::the pinned wolf-lang CHANGELOG has fewer than two releases"; exit 1 }
          $lupChanges = Get-Content upstream/wolf-interp/CHANGELOG.md -Raw
          $entry = ($lupChanges -split '(?m)^## ')[1]
          $m = [regex]::Match($entry, 'Released against pin `([0-9a-f]+)`,\s*wolf-lang \*\*v(\d[\d.]*)\*\*')
          if (-not $m.Success) { Write-Output "::error::the pinned lupin CHANGELOG's newest entry does not name a wolf-lang release it was built against"; exit 1 }
          $lupPin = $m.Groups[1].Value
          $lupSpec = $m.Groups[2].Value
          "wolf $env:WOLF_VER is the release this site advertises"
          "lupin $env:LUPIN_VER was released against pin $lupPin — wolf-lang v$lupSpec"
          $gap = [array]::IndexOf([string[]]$rel, $lupSpec)
          if ($gap -lt 0) {
            Write-Output "::error::lupin $env:LUPIN_VER names wolf-lang v$lupSpec, which is not a release in the pinned wolf CHANGELOG at all — one of the two pins is wrong"
            exit 1
          }
          # The closed set of sentences the two pages are written for. A gap
          # outside it is not a bug in this step: it is a gap nothing on the
          # site has words for, so it stops the job until someone writes them.
          $phrases = [ordered]@{ '0' = 'the same commit'; '1' = 'one release'; '2' = 'two releases' }
          if (-not $phrases.Contains("$gap")) {
            Write-Output "::error::the interpreter is $gap releases behind and /install/ and /play/ have prose for 0, 1 and 2 only — write the sentence, then add its phrase here"
            exit 1
          }
          $want = $phrases["$gap"]
          foreach ($pg in @('site/install/index.html', 'site/play/index.html')) {
            $text = (Get-Content $pg -Raw) -replace '\s+', ' '
            if ($text -notlike "*$want*") {
              Write-Output "::error::the gap is $gap releases and $pg does not say so — it must carry the phrase '$want'"
              exit 1
            }
            foreach ($k in $phrases.Keys) {
              if ($k -eq "$gap") { continue }
              if ($text -like "*$($phrases[$k])*") {
                Write-Output "::error::$pg still carries '$($phrases[$k])' while the counted gap is $gap — a lag paragraph was left unrewritten"
                exit 1
              }
            }
          }
          $reads = switch ($gap) { 0 { "this release" } 1 { "the release before this one" } default { "$gap releases back" } }
          $md = @("", "### The specification pin lag", "",
                  "| | release | specification pin |", "|---|---|---|",
                  "| the compiler this site advertises | wolf $env:WOLF_VER | its own tag |",
                  "| the interpreter beside it | lupin $env:LUPIN_VER | ``$lupPin`` — wolf-lang v$lupSpec |", "",
                  "A counted gap of ${gap} — the interpreter reads $reads, and both pages say '$want'.", "")
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "lupin reads $reads — both pages carry '$want' and neither carries another"

      # The page's own link, fetched the page's own way. A 404 here is the
      # finding the weekly schedule exists to catch.
      - name: download the published archive
        run: |
          $url = "https://github.com/wolffe-lang/wolf-lang/releases/download/v$env:WOLF_VER/wolf-$env:WOLF_VER-x86_64-pc-windows-msvc.tar.gz"
          "GET $url"
          Invoke-WebRequest -Uri $url -OutFile wolf.tar.gz
          $bytes = (Get-Item wolf.tar.gz).Length
          "$bytes bytes"
          if ($bytes -lt 1000000) { Write-Output "::error::the windows archive is $bytes bytes — that is not a toolchain"; exit 1 }

      # THE FOUR ARCHIVES. The front page says a tagged build uploads an
      # archive per host; at v0.2.2 that was a hedge, because the new dist
      # smoke gated the upload on a native tier linux/aarch64 does not serve
      # and the arm archive was built and thrown away (wolf-lang#213). v0.2.3
      # reads the driver's exit-code contract instead and the arm archive is
      # back, so the sentence loses its hedge — and a sentence the site makes
      # unhedged is a sentence this job holds. One HEAD per host: 200, and a
      # size that is a toolchain rather than an error page.
      - name: an archive per host, all four answering
        run: |
          $hosts = @("x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
                     "aarch64-apple-darwin", "x86_64-pc-windows-msvc")
          $fail = 0
          $md = @("", "### The archives the front page promises", "",
                  "| host | status | bytes |", "|---|---|---|")
          foreach ($h in $hosts) {
            $url = "https://github.com/wolffe-lang/wolf-lang/releases/download/v$env:WOLF_VER/wolf-$env:WOLF_VER-$h.tar.gz"
            $code = 0; $len = 0
            try {
              $r = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5
              $code = [int]$r.StatusCode
              $cl = $r.Headers['Content-Length']
              if ($cl) { $len = [int]($cl | Select-Object -First 1) }
            } catch {
              $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            }
            "$h — HTTP $code, $len bytes"
            $md += "| ``$h`` | $code | $len |"
            if ($code -ne 200) { "  FAIL $h answers $code, not 200"; $fail++ }
            elseif ($len -lt 1000000) { "  FAIL $h is $len bytes — that is not a toolchain"; $fail++ }
            else { "  ok   $h" }
          }
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($fail -gt 0) { Write-Output "::error::$fail of the four archives v$env:WOLF_VER promises does not answer 200"; exit 1 }
          "four archives at v$env:WOLF_VER, linux aarch64 included"

      # `tar` has shipped with Windows since the 1803 build of Windows 10.
      # The page tells a learner to type exactly this; so does the job.
      - name: unpack it with the native tar
        run: |
          tar -xzf wolf.tar.gz
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::tar refused the archive"; exit 1 }
          $dir = Join-Path (Get-Location) "wolf-$env:WOLF_VER-x86_64-pc-windows-msvc"
          Get-ChildItem $dir | ForEach-Object { "  {0}  {1}" -f $_.Name, $_.Length }
          $exe = Join-Path $dir "wolf.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error::no wolf.exe in the archive"; exit 1 }
          "WOLF_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WOLF_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # PATH placement, the way the page teaches it.
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The interpreter's own published binary. Until v0.1.22 wolf-interp
      # published no binary for any platform (wolf-interp#54); the bare
      # `lupin.exe` on the release page is what the page now links, so the
      # job downloads that exact asset rather than the zip beside it.
      - name: download the published lupin.exe
        run: |
          $url = "https://github.com/wolffe-lang/wolf-interp/releases/download/v$env:LUPIN_VER/lupin.exe"
          "GET $url"
          Invoke-WebRequest -Uri $url -OutFile lupin.exe
          $bytes = (Get-Item lupin.exe).Length
          "$bytes bytes"
          if ($bytes -lt 500000) { Write-Output "::error::lupin.exe is $bytes bytes — that is not an interpreter"; exit 1 }
          "LUPIN_EXE=$((Get-Item lupin.exe).FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Two hello.lu files, in two directories, because every `.lu` file in
      # one directory is one module (D32) and two `main`s collide. One is
      # written the way a unix-born editor writes it (LF); the other the way
      # Notepad does (CRLF) — the difference is visible to `wolf fmt`, and
      # the page has to say so. A third directory holds the corpus program
      # that uses the task layer, which this host refused by name through
      # v0.2.2 and builds like any other program at v0.2.3.
      - name: the first program, twice — LF and the way Notepad saves it
        run: |
          $lines = @(
            'fn main() -> !int {',
            '    let who = "wolf"',
            '    print("hello, {who}")',
            '    0',
            '}'
          )
          New-Item -ItemType Directory -Force -Path hello, notepad, tasks | Out-Null
          [IO.File]::WriteAllText("$PWD\hello\hello.lu", ($lines -join "`n") + "`n")
          [IO.File]::WriteAllText("$PWD\notepad\hello.lu", ($lines -join "`r`n") + "`r`n")
          Copy-Item upstream/wolf-lang/corpus/conc/spawn_fanout_loop.lu tasks/fanout.lu
          "hello\hello.lu    $((Get-Item hello\hello.lu).Length) bytes (LF)"
          "notepad\hello.lu  $((Get-Item notepad\hello.lu).Length) bytes (CRLF)"
          "tasks\fanout.lu   $((Get-Item tasks\fanout.lu).Length) bytes (the task layer)"

          # The three parity probes, one directory each for the same D32
          # reason. These are the corpus programs the page's table used to
          # call "refuses by name, exit 1"; at this pin the step below
          # ASSERTS that each one runs and prints what its header says.
          New-Item -ItemType Directory -Force -Path probe-spawn, probe-chan, probe-signal | Out-Null
          Copy-Item upstream/wolf-lang/corpus/conc/spawn_fanout_loop.lu probe-spawn/prog.lu
          Copy-Item upstream/wolf-lang/corpus/conc/message_passing.lu   probe-chan/prog.lu
          Copy-Item upstream/wolf-lang/corpus/os/signal_loopback.lu     probe-signal/prog.lu

      # THE TRUTH TABLE. Every command the page could plausibly tell a
      # learner to type, run here with its exact exit code and its exact
      # output recorded — the refusals included. A refusal is a
      # measurement, not a failure; the assertions come after.
      - name: probe every command a learner might type
        run: |
          $rows = @()
          function Probe([string]$dir, [string[]]$cmdargs) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $p = Start-Process -FilePath $env:WOLF_EXE -ArgumentList $cmdargs -NoNewWindow -Wait -PassThru `
                   -WorkingDirectory (Join-Path $PWD $dir) -RedirectStandardOutput $so -RedirectStandardError $se
            $out = Get-Content $so -Raw; $err = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $out) { $out = "" }
            if ($null -eq $err) { $err = "" }
            "=== $dir> wolf $($cmdargs -join ' ')"
            "    exit $($p.ExitCode)"
            if ($out.Trim()) { "    stdout |"; ($out -split "`r?`n" | ForEach-Object { "      $_" }) }
            if ($err.Trim()) { "    stderr |"; ($err -split "`r?`n" | ForEach-Object { "      $_" }) }
            ""
            $script:rows += [pscustomobject]@{ cmd = "wolf $($cmdargs -join ' ')"; dir = $dir; code = $p.ExitCode; out = $out; err = $err }
          }

          Probe "hello"   @("--version")
          Probe "hello"   @("--explain", "E0001")
          Probe "hello"   @("fmt", "--check", ".\hello.lu")
          Probe "hello"   @("build", "hello.lu")
          Probe "hello"   @("build", "--verbose", "hello.lu")
          Probe "hello"   @("run", "hello.lu")
          Probe "hello"   @("run", "--checked", "hello.lu")
          Probe "hello"   @("build", "--release", "hello.lu")
          Probe "hello"   @("conform-run", "hello.lu", "--checked")
          Probe "hello"   @("conform-run", ".\hello.lu", "--checked")
          Probe "hello"   @("conform-run", "hello.lu")
          Probe "hello"   @("test", "hello.lu")
          Probe "tasks"   @("build", "fanout.lu")
          Probe "notepad" @("fmt", "--check", ".\hello.lu")
          Probe "notepad" @("fmt", ".\hello.lu")
          Probe "notepad" @("fmt", "--check", ".\hello.lu")

          # The same table in the run summary, so a reader does not have to
          # open a log to see what a Windows learner gets.
          $md = @("| directory | command | exit | first line of output |", "|---|---|---|---|")
          foreach ($r in $rows) {
            $first = ((($r.out + $r.err) -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 1)
            if (-not $first) { $first = "(no output)" }
            $first = $first -replace '\|', '\|'
            $md += "| $($r.dir) | ``$($r.cmd)`` | $($r.code) | $first |"
          }
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # THE PARITY PROBES — spawn, channels, signals. ASSERTED (ww12).
      #
      # These three corpus programs are the region the page's table USED to
      # call "refuses by name, exit 1": the task layer, channel transfer, and
      # signal reception. ww11 landed this step with $assert = $false, so the
      # runner recorded the "before" every week while the answer was still
      # trunk's; v0.2.3 tags s60b and the archive serves all three, so the
      # line below is $true and these are claims that can go red — exit 0,
      # and byte-for-byte the stdout each program's own corpus header pins
      # (`204\n`, nothing, `reload\n`). Nothing else in the step changed.
      #
      # The signal probe carries a second job: it is the measurement behind
      # /install/'s sentence that a program's OWN reload path works on this
      # host. `os_signal_raise` is an in-process loopback here (a real
      # console event is console-wide), so what stays unserved is EXTERNAL
      # reload/upgrade delivery — the ledger's named gap, which no runner
      # can send and the page therefore cites rather than measures.
      - name: parity probes — spawn, channels, signals (asserted)
        run: |
          $assert = $true

          $probes = @(
            @{ dir = "probe-spawn";  what = "the task layer (spawn + scope + join)";
               corpus = "corpus/conc/spawn_fanout_loop.lu"; stdout = "204`n" },
            @{ dir = "probe-chan";   what = "channel transfer (move sends a region)";
               corpus = "corpus/conc/message_passing.lu";   stdout = "" },
            @{ dir = "probe-signal"; what = "signal reception (listen + wait + raise)";
               corpus = "corpus/os/signal_loopback.lu";     stdout = "reload`n" }
          )

          $rows = @()
          $fail = 0
          foreach ($p in $probes) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $proc = Start-Process -FilePath $env:WOLF_EXE -ArgumentList @("run", "prog.lu") `
                      -NoNewWindow -Wait -PassThru -WorkingDirectory (Join-Path $PWD $p.dir) `
                      -RedirectStandardOutput $so -RedirectStandardError $se
            $o = Get-Content $so -Raw; $e = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $o) { $o = "" }
            if ($null -eq $e) { $e = "" }
            $o = $o -replace "`r`n", "`n"; $e = $e -replace "`r`n", "`n"

            "=== $($p.what)"
            "    $($p.corpus) — wolf run prog.lu — exit $($proc.ExitCode)"
            if ($o.Trim()) { "    stdout | $($o.Trim())" }
            if ($e.Trim()) { "    stderr |"; ($e -split "`n" | ForEach-Object { "      $_" }) }

            $served = ($proc.ExitCode -eq 0 -and $o -eq $p.stdout)
            $note = if ($served) { "serves" }
                    elseif ($e -match "windows-native serves no") { "refuses by name (the ledger)" }
                    elseif ($e -match "cannot compile this yet") { "refuses by name" }
                    else { "neither — read the log" }
            $first = (($e -split "`n") | Where-Object { $_.Trim() } | Select-Object -First 1)
            if (-not $first) { $first = ($o.Trim() -split "`n" | Select-Object -First 1) }
            if (-not $first) { $first = "(no output)" }
            $rows += [pscustomobject]@{ what = $p.what; corpus = $p.corpus; code = $proc.ExitCode; note = $note; first = $first }

            if ($assert) {
              if ($served) { "  ok   $($p.what) serves on this host" }
              else { "  FAIL $($p.what) does not serve: exit $($proc.ExitCode)"; $script:fail++ }
            }
          }

          $md = @("", "### Parity probes — spawn, channels, signals", "",
                  $(if ($assert) { "Asserted at this pin: every row must serve, with the stdout its corpus header pins." } else { "Informational at this pin: recorded, not asserted. The site does not promise trunk." }), "",
                  "| region | corpus program | ``wolf run`` exit | what happened |", "|---|---|---|---|")
          foreach ($r in $rows) {
            $md += "| $($r.what) | ``$($r.corpus)`` | $($r.code) | $($r.note) |"
          }
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($assert -and $fail -gt 0) { Write-Output "::error::$fail parity probe(s) the page now claims are not true of the published archive"; exit 1 }
          if (-not $assert) { "recorded, not asserted — the site does not promise trunk" }
          if ($assert) { "the three regions the page says this host serves, served" }

      # THE BYTE A LEARNER MEETS. v0.2.4 gives the language a byte-width
      # scalar and makes every octet builtin speak `List[byte]`, and the
      # release calls that a breaking change with one line of fix per site.
      # The site that matters here is a learner's: `s.bytes()[0]` used to be
      # an `int`, so the first thing anyone does with it — compare it to a
      # number — is now a type error. That refusal is not a limitation of
      # this host and the page does not file it as one; it is the first
      # thing a Windows learner walking off /install/'s first program will
      # hit, so the page teaches it, and a sentence the page teaches is a
      # sentence this job holds.
      #
      # Both halves are measured: the refusal AND the one-line fix, because
      # a teach-note that names a spelling has to be checked against the
      # spelling actually working. The exit code is 1 — an ordinary program
      # that does not compile, not the exit 2 this host's own refusals use,
      # which is a distinction /install/ now draws on the page.
      - name: the byte a learner meets — E0401, and the one-line fix
        run: |
          New-Item -ItemType Directory -Force -Path byte-bad, byte-good | Out-Null
          [IO.File]::WriteAllText("$PWD\byte-bad\prog.lu", (@(
            'fn main() -> !int {',
            '    let s = "wolf"',
            '    let b = s.bytes()[0]',
            '    if b == 119 { print("w") }',
            '    0',
            '}'
          ) -join "`n") + "`n")
          [IO.File]::WriteAllText("$PWD\byte-good\prog.lu", (@(
            'fn main() -> !int {',
            '    let s = "wolf"',
            '    let b = s.bytes()[0]',
            '    let n = b as int',
            '    if n == 119 { print("w is {n}") }',
            '    0',
            '}'
          ) -join "`n") + "`n")

          function Cap([string]$dir, [string[]]$cmdargs) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $p = Start-Process -FilePath $env:WOLF_EXE -ArgumentList $cmdargs -NoNewWindow -Wait -PassThru `
                   -WorkingDirectory (Join-Path $PWD $dir) -RedirectStandardOutput $so -RedirectStandardError $se
            $o = Get-Content $so -Raw; $e = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $o) { $o = "" }
            if ($null -eq $e) { $e = "" }
            [pscustomobject]@{ code = $p.ExitCode; out = ($o -replace "`r`n", "`n"); err = ($e -replace "`r`n", "`n") }
          }
          $fail = 0
          function Claim([string]$what, [bool]$ok, [string]$saw) {
            if ($ok) { "  ok   $what" } else { "  FAIL $what"; "       saw: $saw"; $script:fail++ }
          }

          $bad = Cap "byte-bad" @("build", "prog.lu")
          "=== comparing a byte to a literal — wolf build prog.lu — exit $($bad.code)"
          ($bad.err -split "`n" | ForEach-Object { "    $_" })
          $text = $bad.out + $bad.err

          Claim "comparing a byte to an int literal is refused, exit 1" ($bad.code -eq 1) "exit $($bad.code)"
          Claim "the refusal is E0401" ($text -match "error\[E0401\]") $text
          Claim "it names which side made it a byte" ($text -match "the other side of ``==`` makes it ``byte``") $text
          Claim "the note names the widening spelling, b as int" ($text -match "``b as int``") $text
          Claim "the note names the narrowing spelling, as byte" ($text -match "``as byte``") $text
          Claim "the note cites the clause" ($text -match "\[type\.byte") $text
          Claim "no hello.exe was written for a program that does not typecheck" `
            (-not (Test-Path (Join-Path $PWD "byte-bad\prog.exe"))) "byte-bad\prog.exe exists"

          # The fix the note names, run. A teach-note is only worth quoting
          # if the spelling it teaches actually builds.
          $good = Cap "byte-good" @("run", "prog.lu")
          "=== the one-line fix — wolf run prog.lu — exit $($good.code)"
          if ($good.err.Trim()) { ($good.err -split "`n" | ForEach-Object { "    $_" }) }
          Claim "the fix the note names builds and runs" ($good.code -eq 0) "exit $($good.code): $($good.err)"
          Claim "b as int widens by zero-extension — 'w' is 119" ($good.out -eq "w is 119`n") ("{0}" -f ($good.out -replace "`n", "\n"))

          $md = @("", "### The byte a learner meets", "",
                  "``wolf build`` on a program comparing ``s.bytes()[0]`` to ``119`` — exit $($bad.code)", "",
                  '```text', $bad.err.TrimEnd(), '```', "",
                  "The spelling that note names — ``let n = b as int`` — builds and runs: ``$($good.out.Trim())``.", "")
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($fail -gt 0) { Write-Output "::error::$fail claim(s) about the byte teach-note are not true of the published archive"; exit 1 }
          "the byte's refusal and its one-line fix, both measured"

      # UNIX-DOMAIN SOCKETS — the third named refusal, new at v0.2.4.
      #
      # s136 gives wolf `net_listen_unix`/`net_connect_unix` on linux and
      # macOS, and this host answers `unsupported` BY NAME — which is the
      # whole point of the row, and the thing #227 was filed about: a posture
      # a program cannot measure is no posture at all. /install/ names it, so
      # it is measured here two ways. The corpus witness prints the same
      # stdout on every host by construction and exits 3 if a bind ever fails
      # with a bare `io` row; a two-branch probe beside it says which side of
      # that construction THIS host took, because a witness that passes
      # vacuously proves nothing about the sentence the page writes.
      - name: unix-domain sockets refuse this host by name
        run: |
          New-Item -ItemType Directory -Force -Path unix-witness, unix-probe | Out-Null
          Copy-Item upstream/wolf-lang/corpus/net/unix_echo.lu unix-witness/prog.lu
          New-Item -ItemType Directory -Force -Path unix-witness/target | Out-Null
          [IO.File]::WriteAllText("$PWD\unix-probe\prog.lu", (@(
            'fn main() -> !int {',
            '    var served = true',
            '    let s = net_listen_unix("ww13.sock") else |e| match e {',
            '        unsupported => {',
            '            served = false',
            '            0 - 1',
            '        },',
            '        _ => {',
            '            print("a path row, not the host row")',
            '            return 1',
            '        },',
            '    }',
            '    if served {',
            '        net_close(s)?',
            '        print("served")',
            '    } else {',
            '        print("unsupported")',
            '    }',
            '    0',
            '}'
          ) -join "`n") + "`n")

          function Cap([string]$dir, [string[]]$cmdargs) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $p = Start-Process -FilePath $env:WOLF_EXE -ArgumentList $cmdargs -NoNewWindow -Wait -PassThru `
                   -WorkingDirectory (Join-Path $PWD $dir) -RedirectStandardOutput $so -RedirectStandardError $se
            $o = Get-Content $so -Raw; $e = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $o) { $o = "" }
            if ($null -eq $e) { $e = "" }
            [pscustomobject]@{ code = $p.ExitCode; out = ($o -replace "`r`n", "`n"); err = ($e -replace "`r`n", "`n") }
          }
          $fail = 0
          function Claim([string]$what, [bool]$ok, [string]$saw) {
            if ($ok) { "  ok   $what" } else { "  FAIL $what"; "       saw: $saw"; $script:fail++ }
          }

          $w = Cap "unix-witness" @("run", "prog.lu")
          "=== corpus/net/unix_echo.lu — wolf run prog.lu — exit $($w.code)"
          if ($w.out.Trim()) { "    stdout | $($w.out.Trim())" }
          if ($w.err.Trim()) { ($w.err -split "`n" | ForEach-Object { "    $_" }) }
          Claim "the unix witness builds and runs on this host" ($w.code -eq 0) "exit $($w.code): $($w.err)"
          Claim "no bind failed with a bare io row (exit 3 is that failure)" ($w.code -ne 3) "exit $($w.code)"
          Claim "the witness prints what its header pins" `
            ($w.out -eq "unix sockets | served_or_named true | echo true | port_is_io true | cleaned true`n") `
            ("{0}" -f ($w.out -replace "`n", "\n"))

          $p2 = Cap "unix-probe" @("run", "prog.lu")
          "=== which branch this host takes — wolf run prog.lu — exit $($p2.code)"
          if ($p2.out.Trim()) { "    stdout | $($p2.out.Trim())" }
          if ($p2.err.Trim()) { ($p2.err -split "`n" | ForEach-Object { "    $_" }) }
          Claim "net_listen_unix compiles here (the refusal is a row, not a build error)" ($p2.code -eq 0) "exit $($p2.code): $($p2.err)"
          Claim "and it answers the unsupported row by name" ($p2.out -eq "unsupported`n") ("{0}" -f ($p2.out -replace "`n", "\n"))

          $md = @("", "### Unix-domain sockets on this host", "",
                  "| probe | exit | stdout |", "|---|---|---|",
                  "| ``corpus/net/unix_echo.lu`` | $($w.code) | ``$($w.out.Trim())`` |",
                  "| which branch this host takes | $($p2.code) | ``$($p2.out.Trim())`` |", "",
                  "``net_listen_unix`` answers the ``unsupported`` row by name — never a bare ``io``, which is the posture ``[os.net.unix]`` requires and the one /install/ writes down.", "")
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($fail -gt 0) { Write-Output "::error::$fail claim(s) about the unix-domain row are not true of the published archive"; exit 1 }
          "the unix family refuses this host by name, and the page may say so"

      # THE TWO s137 ROWS. wolf v0.2.5 is a release about writing servers,
      # and this is the host where a prefork server is written a different
      # way: `reuse_port` and a descriptor handed across a spawn both answer
      # the `unsupported` row BY NAME. /install/ says so in two paragraphs,
      # so both are measured here the way the unix row is — the corpus's own
      # witness for its exact stdout and for the exit 3 it would take if the
      # refusal ever arrived as the WRONG row, and a probe beside it saying
      # which branch of that construction this host actually took, because a
      # witness that passes vacuously proves nothing about a sentence.
      #
      # The third s137 clause is measured for the opposite reason: `net_wait`
      # names no refusal on any host, and the page says a serving loop is
      # written the same way here as anywhere. That is a positive claim, so
      # it gets the witness that would go red if it stopped being one.
      - name: the server surface — two named refusals, and the wait that is not one
        run: |
          function Cap([string]$dir, [string[]]$cmdargs) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $p = Start-Process -FilePath $env:WOLF_EXE -ArgumentList $cmdargs -NoNewWindow -Wait -PassThru `
                   -WorkingDirectory (Join-Path $PWD $dir) -RedirectStandardOutput $so -RedirectStandardError $se
            $o = Get-Content $so -Raw; $e = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $o) { $o = "" }
            if ($null -eq $e) { $e = "" }
            [pscustomobject]@{ code = $p.ExitCode; out = ($o -replace "`r`n", "`n"); err = ($e -replace "`r`n", "`n") }
          }
          $fail = 0
          function Claim([string]$what, [bool]$ok, [string]$saw) {
            if ($ok) { Write-Host "  ok   $what" } else { Write-Host "  FAIL $what"; Write-Host "       saw: $saw"; $script:fail++ }
          }
          function Witness([string]$dir, [string]$corpusFile, [string]$expect, [string]$label) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item "upstream/wolf-lang/corpus/$corpusFile" "$dir/prog.lu"
            $r = Cap $dir @("run", "prog.lu")
            Write-Host "=== corpus/$corpusFile — wolf run prog.lu — exit $($r.code)"
            if ($r.out.Trim()) { Write-Host "    stdout | $($r.out.Trim())" }
            if ($r.err.Trim()) { ($r.err -split "`n" | ForEach-Object { Write-Host "    $_" }) }
            Claim "$label builds and runs on this host" ($r.code -eq 0) "exit $($r.code): $($r.err)"
            Claim "$label took no wrong-row branch (exit 3 is that branch)" ($r.code -ne 3) "exit $($r.code)"
            Claim "$label prints what its header pins" ($r.out -eq ($expect + "`n")) `
              ("{0}" -f ($r.out -replace "`n", "\n"))
            return $r
          }

          # A program can only branch on a row it can NAME, so each probe
          # prints the branch it took rather than asserting the relation the
          # witness already covers.
          $reuseProbe = @(
            'fn main() -> !int {',
            '    var served = true',
            '    let a = net_listen_with("127.0.0.1:0", true, 16) else |e| match e {',
            '        unsupported => {',
            '            served = false',
            '            0 - 1',
            '        },',
            '        _ => {',
            '            print("an address row, not the host row")',
            '            return 1',
            '        },',
            '    }',
            '    if served {',
            '        net_close(a)?',
            '        print("served")',
            '    } else {',
            '        print("unsupported")',
            '    }',
            '    0',
            '}'
          )
          # The option-LESS shape must SERVE here — /install/ says so in the
          # same breath as the refusal, and a page that gets that backwards
          # would send a Windows learner looking for a workaround they do
          # not need.
          $plainProbe = @(
            'fn main() -> !int {',
            '    let a = net_listen_with("127.0.0.1:0", false, 16)?',
            '    let port = net_port(a)?',
            '    let ok = port > 0',
            '    net_close(a)?',
            '    print("plain listen_with | bound {ok}")',
            '    0',
            '}'
          )
          $inheritProbe = @(
            'fn main() -> !int {',
            '    var served = true',
            '    let srv = net_listen_with("127.0.0.1:0", false, 16)?',
            '    let exe = os_exe()?',
            '    let argv = List[str]()',
            '    (mut argv).push("never-runs")',
            '    let inherit = List[int]()',
            '    (mut inherit).push(srv)',
            '    let kid = os_spawn_with(exe, argv, inherit) else |e| match e {',
            '        unsupported => {',
            '            served = false',
            '            0 - 1',
            '        },',
            '        _ => {',
            '            print("a program row, not the host row")',
            '            return 1',
            '        },',
            '    }',
            '    net_close(srv)?',
            '    if served {',
            '        print("served")',
            '    } else {',
            '        print("unsupported")',
            '    }',
            '    0',
            '}'
          )
          function Probe([string]$dir, [string[]]$lines) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            [IO.File]::WriteAllText("$PWD\$dir\prog.lu", (($lines -join "`n") + "`n"))
            $r = Cap $dir @("run", "prog.lu")
            Write-Host "=== $dir — wolf run prog.lu — exit $($r.code)"
            if ($r.out.Trim()) { Write-Host "    stdout | $($r.out.Trim())" }
            if ($r.err.Trim()) { ($r.err -split "`n" | ForEach-Object { Write-Host "    $_" }) }
            return $r
          }

          $w1 = Witness "reuse-witness" "net/reuse_port.lu" `
            "reuse_port | served_or_named true | one_port true | in_use_named true | both_accepted true | gapless true" `
            "the reuse_port witness"
          $p1 = Probe "reuse-probe" $reuseProbe
          Claim "net_listen_with compiles here (the refusal is a row, not a build error)" ($p1.code -eq 0) "exit $($p1.code): $($p1.err)"
          Claim "and reuse_port answers the unsupported row by name" ($p1.out -eq "unsupported`n") ("{0}" -f ($p1.out -replace "`n", "\n"))

          $p2 = Probe "plain-probe" $plainProbe
          Claim "net_listen_with WITHOUT the option serves this host" `
            ($p2.code -eq 0 -and $p2.out -eq "plain listen_with | bound true`n") `
            ("exit {0}: {1}" -f $p2.code, ($p2.out -replace "`n", "\n"))

          $w2 = Witness "inherit-witness" "net/inherit_listener.lu" `
            "inherit | served_or_named true | child_served true | reaped true" `
            "the inherit witness"
          $p3 = Probe "inherit-probe" $inheritProbe
          Claim "os_spawn_with compiles here (the refusal is a row, not a build error)" ($p3.code -eq 0) "exit $($p3.code): $($p3.err)"
          Claim "and a non-empty inherit set answers the unsupported row by name" ($p3.out -eq "unsupported`n") ("{0}" -f ($p3.out -replace "`n", "\n"))

          $w3 = Witness "wait-witness" "net/wait_readiness.lu" `
            "net_wait | quiet_is_empty true | woke_on_the_right_one true | level_triggered true | drained true | closed_peer_is_ready true | forged_is_io true" `
            "the net_wait witness"
          $w4 = Witness "cpus-witness" "os/cpus.lu" `
            "cpus | answered true | at_least_one true | stable true" `
            "the os_cpus witness"

          $md = @("", "### The s137 server surface on this host", "",
                  "| probe | exit | stdout |", "|---|---|---|",
                  "| ``corpus/net/reuse_port.lu`` | $($w1.code) | ``$($w1.out.Trim())`` |",
                  "| which branch reuse_port takes here | $($p1.code) | ``$($p1.out.Trim())`` |",
                  "| ``net_listen_with`` without the option | $($p2.code) | ``$($p2.out.Trim())`` |",
                  "| ``corpus/net/inherit_listener.lu`` | $($w2.code) | ``$($w2.out.Trim())`` |",
                  "| which branch the inherit set takes here | $($p3.code) | ``$($p3.out.Trim())`` |",
                  "| ``corpus/net/wait_readiness.lu`` | $($w3.code) | ``$($w3.out.Trim())`` |",
                  "| ``corpus/os/cpus.lu`` | $($w4.code) | ``$($w4.out.Trim())`` |", "",
                  "``reuse_port`` and a non-empty inherit set answer the ``unsupported`` row BY NAME — the fourth and fifth named refusals /install/ counts. ``net_wait`` and ``os_cpus`` serve, and the option-less ``net_listen_with`` serves, which is the other half of the same paragraph.", "")
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($fail -gt 0) { Write-Output "::error::$fail claim(s) about the s137 server surface are not true of the published archive"; exit 1 }
          "two named refusals and three served calls, all measured — the page may say five"

      # THE ASSERTIONS. The page's claims, one per sentence. When one fails
      # the page is wrong, and this job says so before a learner finds out.
      - name: the claims the page makes
        run: |
          function Cap([string]$dir, [string[]]$cmdargs) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $p = Start-Process -FilePath $env:WOLF_EXE -ArgumentList $cmdargs -NoNewWindow -Wait -PassThru `
                   -WorkingDirectory (Join-Path $PWD $dir) -RedirectStandardOutput $so -RedirectStandardError $se
            $o = Get-Content $so -Raw; $e = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $o) { $o = "" }
            if ($null -eq $e) { $e = "" }
            [pscustomobject]@{ code = $p.ExitCode; out = ($o -replace "`r`n", "`n"); err = ($e -replace "`r`n", "`n") }
          }
          $fail = 0
          function Claim([string]$what, [bool]$ok, [string]$saw) {
            if ($ok) { "  ok   $what" } else { "  FAIL $what"; "       saw: $saw"; $script:fail++ }
          }

          # "That leaves a folder holding wolf.exe, the C-import worker, the
          # runtime library wolf_rt.lib and the licenses."
          foreach ($f in @("wolf.exe", "wolf-cimport-worker.exe", "wolf_rt.lib", "LICENSE", "LICENSE-EXCEPTION")) {
            Claim "the archive carries $f" (Test-Path (Join-Path $env:WOLF_DIR $f)) "missing from $env:WOLF_DIR"
          }

          # "Every .lu file in a directory is one module, so two files each
          # with a main is a duplicate definition rather than two programs."
          New-Item -ItemType Directory -Force -Path twomains | Out-Null
          $prog = @('fn main() -> !int {', '    print("hello, wolf")', '    0', '}')
          [IO.File]::WriteAllText("$PWD\twomains\hello.lu", ($prog -join "`n") + "`n")
          [IO.File]::WriteAllText("$PWD\twomains\other.lu", ($prog -join "`n") + "`n")
          $d = Cap "twomains" @("build", "hello.lu")
          Claim "two mains in one folder is a duplicate definition" (($d.out + $d.err) -match "E0302") ($d.out + $d.err)

          # "wolf --version answers, and names the release this site pins."
          $v = Cap "hello" @("--version")
          Claim "wolf --version exits 0" ($v.code -eq 0) "exit $($v.code)"
          Claim "wolf --version names wolf $env:WOLF_VER" ($v.out.Split("`n")[0].StartsWith("wolf $env:WOLF_VER ")) $v.out.Split("`n")[0]

          # "The formatter and the diagnostic catalogue are in the binary."
          $f = Cap "hello" @("fmt", "--check", ".\hello.lu")
          Claim "wolf fmt --check exits 0 on canonical LF source" ($f.code -eq 0) "exit $($f.code): $($f.err)"
          $e = Cap "hello" @("--explain", "E0001")
          Claim "wolf --explain E0001 exits 0" ($e.code -eq 0) "exit $($e.code)"

          # ---- THE HEADLINE: this host compiles and runs. (s60a, v0.2.2) ----
          # "wolf build hello.lu writes hello.exe. Run it."
          Remove-Item "$PWD\hello\hello.exe" -ErrorAction SilentlyContinue
          $b = Cap "hello" @("build", "hello.lu")
          Claim "wolf build exits 0 on this host" ($b.code -eq 0) "exit $($b.code): $($b.err)"
          $exe = Join-Path $PWD "hello\hello.exe"
          Claim "wolf build leaves hello.exe beside the source" (Test-Path $exe) "no $exe"
          if (Test-Path $exe) {
            $so = New-TemporaryFile
            $r = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -WorkingDirectory (Join-Path $PWD "hello") -RedirectStandardOutput $so
            $ro = (Get-Content $so -Raw) -replace "`r`n", "`n"
            Remove-Item $so -Force
            Claim "hello.exe prints hello, wolf" ($ro -eq "hello, wolf`n") ("{0}" -f ($ro -replace "`n", "\n"))
            Claim "hello.exe exits 0" ($r.ExitCode -eq 0) "exit $($r.ExitCode)"
          }

          # "wolf run hello.lu does both in one step."
          $r1 = Cap "hello" @("run", "hello.lu")
          Claim "wolf run exits 0" ($r1.code -eq 0) "exit $($r1.code): $($r1.err)"
          Claim "wolf run prints hello, wolf" ($r1.out -eq "hello, wolf`n") ("{0}" -f ($r1.out -replace "`n", "\n"))

          # "--checked builds the same program with the checked runtime, and
          # it runs here too."
          $r2 = Cap "hello" @("run", "--checked", "hello.lu")
          Claim "wolf run --checked exits 0" ($r2.code -eq 0) "exit $($r2.code): $($r2.err)"
          Claim "wolf run --checked prints hello, wolf" ($r2.out -eq "hello, wolf`n") ("{0}" -f ($r2.out -replace "`n", "\n"))

          # "wolf build --verbose names the linker it chose."
          $vb = Cap "hello" @("build", "--verbose", "--no-cache", "hello.lu")
          Claim "wolf build --verbose exits 0" ($vb.code -eq 0) "exit $($vb.code): $($vb.err)"
          Claim "wolf build --verbose names the linker rung" ($vb.err -match "lld-link|rust-lld|link\.exe|WOLF_LINKER") $vb.err

          # "wolf build --release refuses this host by name: the LLVM tier is
          # s60c's." The page quotes this sentence, so the transcript goes to
          # the run summary as well as through the regex.
          $rel = Cap "hello" @("build", "--release", "hello.lu")
          Claim "wolf build --release refuses with exit 2" ($rel.code -eq 2) "exit $($rel.code)"
          Claim "wolf build --release names the release tier" ($rel.err -match "cannot run the release tier") $rel.err
          Claim "the refusal names the two hosts the tier serves" ($rel.err -match "linux/x86-64" -and $rel.err -match "macOS/aarch64") $rel.err
          $md = @("", "### ``wolf build --release`` — the sentence the page quotes", "",
                  "exit $($rel.code)", "", '```text', $rel.err.TrimEnd(), '```', "")
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # "A program that uses the task layer builds like any other." At
          # v0.2.2 this was the twenty-one-row refusal paragraph; s60b lands
          # at v0.2.3 and the page's limits section retires it, so the claim
          # inverts. The parity step above runs the same program; this asserts
          # that the ORDINARY verb a learner types on it produces an ordinary
          # executable, which is the sentence /install/ now makes.
          Remove-Item "$PWD\tasks\fanout.exe" -ErrorAction SilentlyContinue
          $tk = Cap "tasks" @("build", "fanout.lu")
          Claim "the task layer builds on this host" ($tk.code -eq 0) "exit $($tk.code): $($tk.err)"
          Claim "wolf build leaves fanout.exe beside the source" (Test-Path (Join-Path $PWD "tasks\fanout.exe")) "no tasks\fanout.exe"
          Claim "no refusal names windows-native any more" (-not ($tk.err -match "windows-native serves no")) $tk.err

          # "wolf conform-run --checked runs a program on the compiler's
          # checked machine and prints its output in a record."
          $c = Cap "hello" @("conform-run", "hello.lu", "--checked")
          Claim "conform-run --checked exits 0" ($c.code -eq 0) "exit $($c.code): $($c.err)"
          $rec = $null
          try { $rec = $c.out | ConvertFrom-Json } catch { }
          Claim "conform-run --checked prints a JSON record" ($null -ne $rec) $c.out
          if ($rec) {
            Claim "the record reached the run phase" ($rec.phase_reached -eq "run") $rec.phase_reached
            Claim "the record's verdict is exit(0)" ($rec.verdict -eq "exit(0)") $rec.verdict
            Claim "the record carries the program's stdout" ($rec.stdout_inline -eq "hello, wolf`n") ("{0}" -f ($rec.stdout_inline -replace "`n", "\n"))
          }

          # "A bare entry name works everywhere now (wolf-lang#206 closed at
          # v0.2.2): `hello.lu` and `.\hello.lu` produce the same record."
          $c2 = Cap "hello" @("conform-run", ".\hello.lu", "--checked")
          Claim "conform-run takes a bare entry name" ($c.code -eq 0 -and $c2.code -eq 0) "bare exit $($c.code), dotted exit $($c2.code)"
          Claim "both spellings produce the same record" ($c.out -eq $c2.out) "the records differ"

          # "wolf test runs it too, and reports a verdict instead of output."
          $t = Cap "hello" @("test", "hello.lu")
          Claim "wolf test exits 0" ($t.code -eq 0) "exit $($t.code): $($t.err)"
          Claim "wolf test reports one passing test" ($t.out -match "1 passed; 0 failed") $t.out

          # "Without --checked conform-run does not run your program."
          $u = Cap "hello" @("conform-run", "hello.lu")
          $urec = $null
          try { $urec = $u.out | ConvertFrom-Json } catch { }
          Claim "conform-run without --checked does not run it" ($urec -and $urec.verdict -eq "unsupported") $u.out

          # "A file saved by Notepad is not canonically formatted; `wolf fmt`
          # fixes it." Both halves, because the page teaches both — and the
          # fixture is rewritten here, because the probe step above already
          # ran `wolf fmt` over it.
          [IO.File]::WriteAllText("$PWD\notepad\hello.lu", (@(
            'fn main() -> !int {',
            '    let who = "wolf"',
            '    print("hello, {who}")',
            '    0',
            '}'
          ) -join "`r`n") + "`r`n")
          $n1 = Cap "notepad" @("fmt", "--check", ".\hello.lu")
          Claim "wolf fmt --check exits 1 on a CRLF file" ($n1.code -eq 1) "exit $($n1.code)"
          Claim "wolf fmt --check names the file it refuses" ($n1.err -match "is not canonically formatted") $n1.err
          $n2 = Cap "notepad" @("fmt", ".\hello.lu")
          Claim "wolf fmt rewrites it, exit 0" ($n2.code -eq 0) "exit $($n2.code): $($n2.err)"
          $n3 = Cap "notepad" @("fmt", "--check", ".\hello.lu")
          Claim "wolf fmt --check then exits 0" ($n3.code -eq 0) "exit $($n3.code): $($n3.err)"

          if ($fail -gt 0) { Write-Output "::error::$fail claim(s) the page makes are not true of the published archive"; exit 1 }
          "every claim the page makes held against the published archive"

      # THE OTHER BRANCH. Everything above ran on a box that HAS Visual
      # Studio Build Tools; a learner's box may not, and the page has to
      # quote what that learner sees rather than imagine it.
      #
      # Reaching it honestly takes two moves. First the shell: `LIB` and
      # `INCLUDE` unset and PATH cut back to System32 plus the wolf folder —
      # a plain PowerShell window, not a Developer Command Prompt. That
      # alone is NOT enough, and the page says so: wolf's discovery finds
      # the Visual Studio install by itself, which is the point of having a
      # discovery order. So, second, the Windows SDK's registry root is
      # taken away for the length of one command — the same condition as a
      # box where "Desktop development with C++" was never installed, since
      # that root is where the import libraries are found — and put back
      # immediately after, restored again by the always() step below even if
      # this one dies.
      - name: what a learner without Build Tools sees
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots",
            "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots"
          )
          $saved = @{}
          foreach ($k in $keys) {
            $v = (Get-ItemProperty -Path $k -Name KitsRoot10 -ErrorAction SilentlyContinue).KitsRoot10
            if ($v) { $saved[$k] = $v }
          }
          ($saved.GetEnumerator() | ForEach-Object { "saved $($_.Key) KitsRoot10 = $($_.Value)" })
          $saved | ConvertTo-Json | Out-File -FilePath "$PWD\kitsroot.json" -Encoding utf8

          # A command in a chosen environment: the current one, minus the
          # names a Developer Command Prompt sets, with PATH cut back.
          function RunPlain([string]$dir, [string[]]$cmdargs) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $env:WOLF_EXE
            foreach ($a in $cmdargs) { $psi.ArgumentList.Add($a) }
            $psi.WorkingDirectory = (Join-Path $PWD $dir)
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            foreach ($n in @("LIB", "INCLUDE", "WindowsSdkDir", "WindowsSDKVersion",
                             "VCINSTALLDIR", "VSINSTALLDIR", "VCToolsInstallDir",
                             "VSCMD_ARG_TGT_ARCH", "VCPKG_ROOT")) {
              $psi.Environment.Remove($n) | Out-Null
            }
            $psi.Environment["PATH"] = "C:\Windows\System32;C:\Windows;$env:WOLF_DIR"
            $p = [System.Diagnostics.Process]::Start($psi)
            $o = $p.StandardOutput.ReadToEnd(); $e = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            [pscustomobject]@{ code = $p.ExitCode; out = ($o -replace "`r`n", "`n"); err = ($e -replace "`r`n", "`n") }
          }

          Remove-Item "$PWD\hello\hello.exe" -ErrorAction SilentlyContinue
          Remove-Item "$PWD\hello\.lu-cache" -Recurse -Force -ErrorAction SilentlyContinue

          "=== rung A: a plain shell, LIB unset, PATH cut to System32 + the wolf folder"
          $a = RunPlain "hello" @("build", "--no-cache", "hello.lu")
          "    exit $($a.code)"
          if ($a.err.Trim()) { "    stderr | $($a.err)" }

          "=== rung B: the same shell on a box with no Windows SDK installed"
          if ($saved.Count -eq 0) { Write-Output "::error::no KitsRoot10 to take away — this runner is not shaped the way the probe assumes"; exit 1 }
          foreach ($k in $saved.Keys) {
            Remove-ItemProperty -Path $k -Name KitsRoot10 -ErrorAction Stop
          }
          Remove-Item "$PWD\hello\hello.exe" -ErrorAction SilentlyContinue
          Remove-Item "$PWD\hello\.lu-cache" -Recurse -Force -ErrorAction SilentlyContinue
          $b = RunPlain "hello" @("build", "--no-cache", "hello.lu")
          $brun = RunPlain "hello" @("run", "--no-cache", "hello.lu")
          foreach ($k in $saved.Keys) {
            Set-ItemProperty -Path $k -Name KitsRoot10 -Value $saved[$k]
          }
          "    wolf build: exit $($b.code)"
          if ($b.err.Trim()) { "    stderr | $($b.err)" }
          "    wolf run:   exit $($brun.code)"
          if ($brun.err.Trim()) { "    stderr | $($brun.err)" }

          $fail = 0
          function Claim([string]$what, [bool]$ok, [string]$saw) {
            if ($ok) { "  ok   $what" } else { "  FAIL $what"; "       saw: $saw"; $script:fail++ }
          }

          # "You do not need a Developer Command Prompt: wolf finds the
          # toolchain itself."
          Claim "a plain shell with LIB unset still builds (the discovery works)" ($a.code -eq 0) "exit $($a.code): $($a.err)"

          # THE SENTENCE THE PAGE QUOTES.
          Claim "with no Windows SDK, wolf build refuses with exit 2" ($b.code -eq 2) "exit $($b.code)"
          Claim "the refusal names the missing toolset" ($b.err -match "windows-native: no MSVC toolset / Windows SDK found") $b.err
          Claim "the refusal names the import libraries by file" ($b.err -match "kernel32\.lib" -and $b.err -match "msvcrt\.lib") $b.err
          Claim "the refusal names the workload to install" ($b.err -match 'Visual Studio Build Tools.+Desktop development with C\+\+') $b.err
          Claim "wolf run refuses identically" ($brun.code -eq 2 -and $brun.err -match "no MSVC toolset / Windows SDK found") "exit $($brun.code): $($brun.err)"

          # The page prints this refusal verbatim; put it in the summary too.
          $md = @("", "### What a learner without Build Tools sees", "",
                  "``wolf build hello.lu`` — exit $($b.code)", "", '```text', $b.err.TrimEnd(), '```', "")
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($fail -gt 0) { Write-Output "::error::$fail claim(s) about the no-toolchain branch are wrong"; exit 1 }
          "the no-toolchain branch says what the page quotes"

      # Whatever happened above, the runner leaves with its SDK root intact.
      - name: put the Windows SDK root back
        if: always()
        run: |
          if (-not (Test-Path "$PWD\kitsroot.json")) { "nothing was taken away"; exit 0 }
          $saved = Get-Content "$PWD\kitsroot.json" -Raw | ConvertFrom-Json
          foreach ($p in $saved.PSObject.Properties) {
            $now = (Get-ItemProperty -Path $p.Name -Name KitsRoot10 -ErrorAction SilentlyContinue).KitsRoot10
            if ($now -ne $p.Value) {
              Set-ItemProperty -Path $p.Name -Name KitsRoot10 -Value $p.Value
              "restored $($p.Name)"
            } else {
              "$($p.Name) is already back"
            }
          }

      # The interpreter a Windows learner can now download and double-click.
      # Every claim the page's interpreter section makes about it.
      - name: lupin.exe, the published interpreter
        run: |
          $fail = 0
          function Claim([string]$what, [bool]$ok, [string]$saw) {
            if ($ok) { "  ok   $what" } else { "  FAIL $what"; "       saw: $saw"; $script:fail++ }
          }
          function CapLupin([string[]]$cmdargs) {
            $so = New-TemporaryFile; $se = New-TemporaryFile
            $p = Start-Process -FilePath $env:LUPIN_EXE -ArgumentList $cmdargs -NoNewWindow -Wait -PassThru `
                   -WorkingDirectory (Join-Path $PWD "hello") -RedirectStandardOutput $so -RedirectStandardError $se
            $o = Get-Content $so -Raw; $e = Get-Content $se -Raw
            Remove-Item $so, $se -Force
            if ($null -eq $o) { $o = "" }
            if ($null -eq $e) { $e = "" }
            [pscustomobject]@{ code = $p.ExitCode; out = ($o -replace "`r`n", "`n"); err = ($e -replace "`r`n", "`n") }
          }

          # "One file, no installer, no runtime library beside it."
          $v = CapLupin @("--version")
          "lupin --version | $($v.out.Trim())"
          Claim "lupin --version exits 0" ($v.code -eq 0) "exit $($v.code): $($v.err)"
          Claim "lupin --version names lupin $env:LUPIN_VER" ($v.out -match "^lupin $([regex]::Escape($env:LUPIN_VER))") $v.out

          # "Running a file takes no subcommand."
          $r = CapLupin @("hello.lu")
          Claim "lupin hello.lu exits 0" ($r.code -eq 0) "exit $($r.code): $($r.err)"
          Claim "lupin hello.lu prints hello, wolf" ($r.out -eq "hello, wolf`n") ("{0}" -f ($r.out -replace "`n", "\n"))

          if ($fail -gt 0) { Write-Output "::error::$fail claim(s) the page makes about lupin.exe are wrong"; exit 1 }
          "lupin.exe runs a first program on this host"

  # The playground's editor is the one piece of this site whose behaviour
  # is platform-dependent: `MAC = /Mac|iPhone|iPad/.test(navigator.platform)`
  # decides whether the modifier is Cmd or Ctrl, and every binding hangs off
  # that. On a windows runner node reports `Win32`, so the DOM suite here
  # exercises the CONTROL spelling of every binding the playground page
  # documents — the half a macOS or ubuntu run can never reach.
  #
  # This is not a browser. A real Edge/Chrome-on-Windows check would need a
  # webdriver dependency, and the playground takes no dependencies; what is
  # proved here is that the editor's key routing, undo coalescing and caret
  # mirror behave on a Windows-shaped platform string.
  editor-on-windows:
    name: the editor's windows key spelling
    runs-on: windows-latest
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: node reports a windows platform
        run: node -e "console.log(navigator.platform, process.platform)"
      - name: the editor suites, with Ctrl as the modifier
        run: node --test @((Get-ChildItem tests/*.test.mjs).FullName)
