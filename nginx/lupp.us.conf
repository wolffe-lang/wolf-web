# lupp.us — the wolf language site.
#
# Install after certbot has issued the certificate:
#   sudo cp nginx/lupp.us.conf /etc/nginx/conf.d/lupp.us.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites the ssl_certificate paths itself when it runs against
# the bootstrap file; if the paths below do not match what it wrote, take
# certbot's version of those two lines.

server {
    listen 80;
    listen [::]:80;
    server_name lupp.us www.lupp.us;
    return 301 https://lupp.us$request_uri;
}

server {
    # nginx 1.20 on this box: http2 is a listen parameter. The separate
    # `http2 on;` directive is 1.25.1 and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lupp.us;

    ssl_certificate     /etc/letsencrypt/live/lupp.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lupp.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lupp.us$request_uri;
}

server {
    # nginx 1.20 on this box: http2 is a listen parameter. The separate
    # `http2 on;` directive is 1.25.1 and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lupp.us;

    root /var/www/lupp.us/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/lupp.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lupp.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lupp.us.access.log;
    error_log  /var/log/nginx/lupp.us.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # The playground runs the interpreter in the visitor's own browser as
    # WebAssembly. Nothing is uploaded and nothing runs here, so the
    # policy can stay tight: no third-party anything.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;


    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # wasm needs its type or the browser refuses the streaming compile, and
    # nginx 1.20's mime.types has no entry for it. It goes HERE, in a
    # location, and not in a server-level `types` block: that block
    # REPLACES the whole MIME map instead of extending it, which served
    # every page as application/octet-stream and made browsers download
    # the site rather than render it.
    #
    # An add_header in a location REPLACES the server's set above instead of
    # adding to it, so every location here that sets a header repeats all four
    # security headers, byte for byte (tests/nginx.test.mjs holds it). Until
    # ww35 this one and the script location below sent none of them.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    }

    # Immutable build products: the deploy is a fresh directory each time,
    # so anything fingerprinted can be cached hard.
    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    }

    # The book is generated and changes per deploy, and its scripts and
    # styles are NOT fingerprinted: mdBook names them toc.js, book.js and so
    # on at every render. Cached for 7 days by the location above, a
    # returning reader kept the old toc.js (the old sidebar) for up to a week
    # after the book moved (wolf-book PR #65's note for ww35). So the book
    # revalidates everything instead: no-cache still caches, and asks first,
    # and an unchanged file answers 304. build.sh also versions every script
    # and stylesheet reference in the book's pages by the book's pin, which
    # is what reaches a copy already cached under the old header.
    #
    # `^~` because a regex location outranks a plain prefix: without it the
    # script location above would still take /book/*.js, and a miss there
    # would never see the error_page below.
    #
    # A miss under /book/ answers the book's own 404 page, which draws the
    # book's sidebar at any depth (bs55), rather than the site's /404.html.
    location ^~ /book/ {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /book/404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    }

    # The API docs are generated; they change per deploy.
    location /docs/  { try_files $uri $uri/ $uri.html =404; }

    # Spec and catalogue files are markdown; serve them as text rather
    # than prompting a download.
    location ~* \.(md|ebnf)$ {
        default_type text/plain;
        charset utf-8;
    }

    error_page 404 /404.html;
}
