# lupp.us — the wolf language site.
#
# Install after certbot has issued the certificate:
#   sudo cp nginx/lupp.us.conf /etc/nginx/conf.d/lupp.us.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot rewrites the ssl_certificate paths itself when it runs against
# the bootstrap file; if the paths below do not match what it wrote, take
# certbot's version of those two lines.

server {
    listen 80;
    listen [::]:80;
    server_name lupp.us www.lupp.us;
    return 301 https://lupp.us$request_uri;
}

server {
    # nginx 1.20 on this box: http2 is a listen parameter. The separate
    # `http2 on;` directive is 1.25.1 and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lupp.us;

    ssl_certificate     /etc/letsencrypt/live/lupp.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lupp.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lupp.us$request_uri;
}

server {
    # nginx 1.20 on this box: http2 is a listen parameter. The separate
    # `http2 on;` directive is 1.25.1 and newer.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lupp.us;

    root /var/www/lupp.us/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/lupp.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lupp.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lupp.us.access.log;
    error_log  /var/log/nginx/lupp.us.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # The playground runs the interpreter in the visitor's own browser as
    # WebAssembly. Nothing is uploaded and nothing runs here, so the
    # policy can stay tight: no third-party anything.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;

    # wasm must be served with the right type or the browser refuses the
    # streaming compile.
    types { application/wasm wasm; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Immutable build products: the deploy is a fresh directory each time,
    # so anything fingerprinted can be cached hard.
    location ~* \.(wasm|js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The book and the API docs are generated; they change per deploy.
    location /book/  { try_files $uri $uri/ $uri.html =404; }
    location /docs/  { try_files $uri $uri/ $uri.html =404; }

    # Spec and catalogue files are markdown; serve them as text rather
    # than prompting a download.
    location ~* \.(md|ebnf)$ {
        default_type text/plain;
        charset utf-8;
    }

    error_page 404 /404.html;
}
