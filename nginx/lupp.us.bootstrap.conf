# lupp.us — bootstrap nginx configuration
#
# Use this file FIRST, before the Let's Encrypt certificate exists.
# After certbot succeeds, replace it with lupp.us.conf.
#
# Setup (as documented for the other sites on this box):
#   sudo cp nginx/lupp.us.bootstrap.conf /etc/nginx/conf.d/lupp.us.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d lupp.us -d www.lupp.us
#   sudo cp nginx/lupp.us.conf /etc/nginx/conf.d/lupp.us.conf
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lupp.us www.lupp.us;

    root /var/www/lupp.us/current;
    index index.html;

    access_log /var/log/nginx/lupp.us.access.log;
    error_log  /var/log/nginx/lupp.us.error.log;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lupp.us/current;
        allow all;
    }
}
